# SPDX-License-Identifier: GPL-3.0-or-later
name: ReiserFS Common V2 development qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

      - name: Independently format and qualify actual clean ReiserFS media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y reiserfsprogs
          for version in 3.5 3.6; do
            truncate -s 64M "reiser-$version.img"
            mkreiserfs -q -f -f -v "$version" "reiser-$version.img"
            sha256sum "reiser-$version.img" > before.sha256
            case "$version" in 3.5) variant=1;; 3.6) variant=2;; esac
            build/test_reiserfs build/carrier/REISERFS.so "reiser-$version.img" "$variant"
            build/test_reiserfs build/firmware/REISERFS.so "reiser-$version.img" "$variant"
            sha256sum -c before.sha256
          done
